<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <filter id="rough" x="-10%" y="-20%" width="120%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009" numOctaves="4" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <filter id="rough2" x="-10%" y="-20%" width="120%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <linearGradient id="m1" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#2C3A32" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#3C4E43" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4C5F53" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24322B" stop-opacity=".34"/>
      <stop offset=".6" stop-color="#34463C" stop-opacity=".18"/>
      <stop offset="1" stop-color="#44574A" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2C25" stop-opacity=".30"/>
      <stop offset="1" stop-color="#2E4038" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C6E5E" stop-opacity=".14"/>
      <stop offset=".4" stop-color="#5B7E6C" stop-opacity=".055"/>
      <stop offset="1" stop-color="#6E8F7D" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F7F1E4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="willow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E4A3A" stop-opacity=".42"/>
      <stop offset="1" stop-color="#2E4A3A" stop-opacity=".05"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C4A05A" stop-opacity=".18"/>
      <stop offset="1" stop-color="#C4A05A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 淡日 -->
  <circle cx="1180" cy="248" r="150" fill="url(#sun)"/>

  <!-- 最远山：带位移滤镜，边缘不成直线 -->
  <g filter="url(#rough)" opacity=".85">
    <path d="M-40 468 L70 372 L126 408 L214 292 L286 372 L352 320 L440 418 L528 356 L614 436 L706 372 L796 452 L872 392 L960 462 L1044 398 L1136 458 L1228 380 L1320 448 L1412 386 L1504 452 L1600 400 L1640 470 L1640 900 L-40 900 Z"
          fill="url(#m1)"/>
  </g>
  <!-- 山脊重笔 -->
  <g filter="url(#rough)" fill="none" stroke="#26332C" stroke-opacity=".22" stroke-width="2.2" stroke-linejoin="round">
    <path d="M-40 468 L70 372 L126 408 L214 292 L286 372 L352 320 L440 418 L528 356 L614 436 L706 372 L796 452 L872 392 L960 462 L1044 398 L1136 458 L1228 380 L1320 448 L1412 386 L1504 452 L1600 400"/>
